<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon bureau</title>
<link rel="stylesheet" href="jeux/jeux.css">
<style>
  :root {
    --wall-a: #14343f;
    --wall-b: #1f5a63;
    --wall-c: #3b7d6e;
    --glass: rgba(14, 30, 36, .82);
    --paper: #f6f4ee;
    --line: #d6d1c3;
    --ink: #1b2428;
    --accent: #e8b84a;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    color: var(--ink);
    background:
      radial-gradient(ellipse at 20% 15%, var(--wall-c) 0%, transparent 55%),
      radial-gradient(ellipse at 85% 90%, #0d2229 0%, transparent 60%),
      linear-gradient(135deg, var(--wall-a), var(--wall-b));
    user-select: none;
  }

  /* ---------- Bureau ---------- */
  #desktop {
    position: absolute; inset: 0 0 48px 0;
    padding: 16px;
    display: grid;
    grid-auto-flow: column;
    grid-template-rows: repeat(auto-fill, 104px);
    grid-auto-columns: 100px;
    gap: 6px;
    align-content: start;
  }
  .icon {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 8px 4px; border-radius: 6px; border: 1px solid transparent;
    background: none; color: #fff; font: inherit; font-size: 13px;
    cursor: default; text-align: center; width: 100%;
  }
  .icon span {
    max-width: 92px; overflow: hidden; text-overflow: ellipsis;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    text-shadow: 0 1px 3px rgba(0,0,0,.7); word-break: break-word;
  }
  .icon svg { width: 52px; height: 52px; flex: none; filter: drop-shadow(0 2px 3px rgba(0,0,0,.35)); }
  .icon:hover { background: rgba(255,255,255,.1); }
  .icon:focus-visible, .icon.sel { outline: none; background: rgba(255,255,255,.18); border-color: rgba(255,255,255,.45); }

  #empty {
    position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%);
    width: min(460px, 88vw); padding: 28px; border-radius: 10px;
    background: var(--paper); box-shadow: 0 20px 60px rgba(0,0,0,.4);
    user-select: text;
  }
  #empty h1 { margin: 0 0 8px; font-size: 20px; }
  #empty p { margin: 0; line-height: 1.55; font-size: 14px; }
  #empty code { background: #e9e5d8; padding: 2px 6px; border-radius: 4px; font-size: 13px; }

  /* ---------- Fenêtres ---------- */
  .win {
    position: absolute; display: flex; flex-direction: column;
    background: var(--paper); border-radius: 8px; overflow: hidden;
    box-shadow: 0 18px 50px rgba(0,0,0,.45), 0 0 0 1px rgba(0,0,0,.25);
    min-width: 260px; min-height: 160px; resize: both;
    animation: open .14s ease-out;
  }
  @keyframes open { from { transform: scale(.96); opacity: 0; } }
  .win.min { display: none; }
  .bar {
    display: flex; align-items: center; gap: 8px; padding: 0 6px 0 12px; height: 36px;
    background: #e3dfd2; border-bottom: 1px solid var(--line); cursor: grab; flex: none;
    touch-action: none;
  }
  .win:not(.top) .bar { background: #ebe8de; color: #77746a; }
  .bar:active { cursor: grabbing; }
  .bar b { flex: 1; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar button {
    width: 30px; height: 26px; border: 0; background: none; border-radius: 4px;
    font-size: 15px; cursor: pointer; color: inherit;
  }
  .bar button:hover { background: rgba(0,0,0,.1); }
  .bar button.x:hover { background: #c9402b; color: #fff; }
  .bar button:focus-visible { outline: 2px solid var(--ink); }
  .path {
    padding: 6px 12px; font-size: 12px; color: #5d5a50; border-bottom: 1px solid var(--line);
    display: flex; gap: 8px; align-items: center; flex: none;
  }
  .path button { font: inherit; border: 1px solid var(--line); background: #fff; border-radius: 4px; padding: 2px 8px; cursor: pointer; }
  .path button:disabled { opacity: .4; cursor: default; }
  .body { flex: 1; overflow: auto; min-height: 0; }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, 92px); gap: 4px; padding: 12px;
  }
  .grid .icon { color: var(--ink); }
  .grid .icon span { text-shadow: none; }
  .grid .icon:hover { background: rgba(0,0,0,.06); }
  .grid .icon:focus-visible, .grid .icon.sel { background: rgba(232,184,74,.3); border-color: var(--accent); }
  .grid .icon svg { filter: none; }
  .note { padding: 24px; color: #6b685d; font-size: 14px; }
  pre.txt {
    margin: 0; padding: 16px; font: 14px/1.55 "Cascadia Mono", Consolas, monospace;
    white-space: pre-wrap; word-break: break-word; user-select: text; color: var(--ink);
  }
  .player {
    height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 20px; background: #1b2a30; color: #fff; text-align: center;
  }
  .player svg { width: 84px; height: 84px; }
  .player .t { font-size: 15px; font-weight: 600; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .player audio { width: 100%; max-width: 420px; }
  .ico { position: relative; width: 52px; height: 52px; flex: none; }
  .icon .ico > svg { width: 52px; height: 52px; }
  .icon .ico > img { width: 52px; height: 52px; border-radius: 13px; object-fit: cover; display: block; box-shadow: 0 2px 6px rgba(0,0,0,.4); }
  .icon .ico .check { position: absolute; right: -6px; bottom: -4px; width: 22px; height: 22px; filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
  .icon:not(.done) .check { display: none; }
  .icon .ico .badge { position: absolute; right: -6px; bottom: -4px; width: 24px; height: 24px; filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
  .icon:not(.locked) .badge { display: none; }
  .icon.locked .ico > svg:not(.badge) { filter: grayscale(1) brightness(.75); opacity: .75; }
  .msg { height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 18px; gap: 14px; }
  .msg p { margin: 0; font-size: 14px; line-height: 1.5; }
  .msg button { align-self: flex-end; font: inherit; font-size: 13px; padding: 6px 22px; cursor: pointer; background: var(--ink); color: #fff; border: 0; border-radius: 5px; }
  .msg button:hover { background: #2d3b41; }
  .msg button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #toast {
    position: absolute; left: 50%; bottom: 64px; transform: translate(-50%, 12px); z-index: 99999;
    background: var(--glass); color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 14px;
    opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; max-width: 90vw; text-align: center;
    border: 1px solid rgba(255,255,255,.18);
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
  .media { display: grid; place-items: center; background: #101a1e; height: 100%; }
  .media img, .media video { max-width: 100%; max-height: 100%; display: block; }

  /* ---------- Barre des tâches ---------- */
  #taskbar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 48px;
    background: var(--glass); backdrop-filter: blur(14px);
    border-top: 1px solid rgba(255,255,255,.12);
    display: flex; align-items: center; gap: 6px; padding: 0 10px; color: #fff;
  }
  #tasks { flex: 1; display: flex; gap: 6px; overflow-x: auto; }
  .task {
    font: inherit; font-size: 13px; color: #fff; background: rgba(255,255,255,.1);
    border: 0; border-bottom: 3px solid transparent; border-radius: 5px;
    padding: 6px 12px; max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer;
  }
  .task:hover { background: rgba(255,255,255,.2); }
  .task.on { border-bottom-color: var(--accent); background: rgba(255,255,255,.18); }
  .task:focus-visible { outline: 2px solid var(--accent); }
  #clock { font-size: 13px; text-align: right; line-height: 1.25; padding: 0 6px; }

  /* ----- barre des tâches : boutons son / fond ----- */
  .tb-btn { font: inherit; font-size: 15px; color: #fff; background: rgba(255,255,255,.1); border: 0; border-radius: 5px; width: 34px; height: 32px; cursor: pointer; flex: none; }
  .tb-btn:hover { background: rgba(255,255,255,.22); }
  .tb-btn:focus-visible { outline: 2px solid var(--accent); }
  #clock { cursor: default; border-radius: 5px; padding: 3px 8px; }
  #clock:hover { background: rgba(255,255,255,.08); }
  #clock:focus-visible { outline: 2px solid var(--accent); }

  /* ----- menu du fond d'écran ----- */
  #menu-fond {
    position: fixed; z-index: 99990; min-width: 230px; padding: 6px; background: var(--paper); color: var(--ink);
    border-radius: 10px; box-shadow: 0 14px 40px rgba(0,0,0,.45), 0 0 0 1px rgba(0,0,0,.2); user-select: none;
  }
  #menu-fond[hidden] { display: none; }
  .menu-titre { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #77746a; padding: 6px 10px 4px; }
  #menu-fond button { display: block; width: 100%; text-align: left; font: inherit; font-size: 14px; color: inherit; background: none; border: 0; border-radius: 6px; padding: 8px 10px; cursor: pointer; }
  #menu-fond button:hover, #menu-fond button:focus-visible { background: rgba(232,184,74,.3); outline: none; }
  #menu-fond button.actif::after { content: " ✓"; color: #3fae6a; font-weight: 700; }

  /* ----- bloc-notes caché ----- */
  .bn { flex: 1; min-height: 0; display: flex; flex-direction: column; background: #fff; }
  .bn-menu { display: flex; gap: 14px; padding: 4px 12px; font-size: 13px; border-bottom: 1px solid var(--line); background: #f3f1ea; color: #4b483f; flex: none; }
  .bn-zone { flex: 1; min-height: 0; width: 100%; border: 0; outline: none; resize: none; padding: 14px 16px; font: 15px/1.6 "Cascadia Mono", Consolas, monospace; color: var(--ink); background: #fff; user-select: text; }

  /* ----- le dossier débloqué brille ----- */
  .icon.pulse .ico { animation: lueur 1.6s ease-in-out infinite; }
  @keyframes lueur { 50% { filter: drop-shadow(0 0 14px #ffd36a) drop-shadow(0 0 4px #fff); } }

  /* ----- écran de fête ----- */
  #fete {
    position: fixed; inset: 0; z-index: 100000; display: grid; place-items: center; padding: 20px;
    background: rgba(6,16,20,.8); backdrop-filter: blur(6px); animation: fondu .4s ease-out;
  }
  #fete[hidden] { display: none; }
  #confetti { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .fete-carte {
    position: relative; max-width: 460px; text-align: center; color: #fff; padding: 34px 30px 28px;
    background: linear-gradient(160deg, #1d2d3b, #151f28); border: 1px solid rgba(255,211,106,.55); border-radius: 18px;
    box-shadow: 0 20px 70px rgba(0,0,0,.6), 0 0 70px rgba(255,211,106,.18);
    animation: pop2 .65s cubic-bezier(.2,1.3,.4,1);
  }
  .fete-etoile { font-size: 46px; line-height: 1; color: #ffd36a; text-shadow: 0 0 24px rgba(255,211,106,.8); }
  .fete-carte h2 { margin: 10px 0 12px; font-size: 27px; }
  .fete-carte p { margin: 0 0 22px; line-height: 1.65; opacity: .92; white-space: pre-line; }
  #fete-btn { font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; border: 0; border-radius: 999px; padding: 12px 30px; background: #ffd36a; color: #2a1d05; }
  #fete-btn:hover { filter: brightness(1.08); }
  #fete-btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  @keyframes pop2 { from { transform: scale(.7); opacity: 0; } }

  @media (prefers-reduced-motion: reduce) { .win { animation: none; } .icon.pulse .ico, .fete-carte, #fete { animation: none; } }
  @media (max-width: 600px) { .win { min-width: 0; } }
</style>
</head>
<body>

<main id="desktop" aria-label="Bureau"></main>

<section id="empty" hidden>
  <h1>Je cherche le dossier « bureau »</h1>
  <p id="emptyMsg"></p>
</section>

<!-- Formulaire invisible : Netlify le détecte et reçoit les réponses du quiz Discord -->
<form name="quiz-discord" method="POST" data-netlify="true" hidden>
  <input type="hidden" name="form-name" value="quiz-discord">
  <input name="joueuse"><textarea name="reponses"></textarea>
  <input name="q1"><input name="q2"><input name="q3"><input name="q4"><input name="q5">
  <input name="q6"><input name="q7"><input name="q8">
</form>

<div id="toast" role="status" aria-live="polite"></div>

<div id="menu-fond" role="menu" aria-label="Fond d’écran" hidden></div>
<input type="file" id="fond-fichier" accept="image/*" hidden>

<div id="fete" role="dialog" aria-modal="true" aria-labelledby="fete-titre" hidden>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <div class="fete-carte">
    <div class="fete-etoile" aria-hidden="true">★</div>
    <h2 id="fete-titre"></h2>
    <p id="fete-texte"></p>
    <button type="button" id="fete-btn"></button>
  </div>
</div>

<footer id="taskbar">
  <div id="tasks" role="toolbar" aria-label="Fenêtres ouvertes"></div>
  <button type="button" class="tb-btn" id="btn-fond" aria-label="Changer le fond d’écran" title="Fond d’écran">🖼</button>
  <button type="button" class="tb-btn" id="btn-son" aria-label="Couper ou remettre le son" title="Son">🔊</button>
  <div id="clock" role="button" tabindex="0" aria-label="Horloge"></div>
</footer>

<!-- Optionnel : liste écrite à la main, utilisée seulement sans serveur -->
<script src="bureau.js"></script>
<script src="perso.js"></script>
<script src="sons.js"></script>
<script src="succes.js"></script>
<script src="jeux/jeux.js"></script>
<script>
(() => {
  const $ = (s, el = document) => el.querySelector(s);
  const desktop = $('#desktop'), tasks = $('#tasks');
  const son = n => { try { window.Sons && window.Sons[n] && window.Sons[n](); } catch {} };
  const succes = id => { try { window.Succes && window.Succes.debloquer(id); } catch {} };
  const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
  const lsDel = k => { try { localStorage.removeItem(k); } catch {} };

  /* ---------- Types de fichiers ---------- */
  const EXT = {
    image: ['png','jpg','jpeg','gif','webp','svg','bmp','avif'],
    video: ['mp4','webm','ogv','mov','m4v'],
    audio: ['mp3','wav','m4a','aac','flac','ogg','oga'],
    text:  ['txt','md','log','json','csv']
  };
  const typeOf = name => {
    const e = name.split('.').pop().toLowerCase();
    for (const t in EXT) if (EXT[t].includes(e)) return t;
    return 'other';
  };

  /* ---------- Icônes ---------- */
  const ICONS = {
    folder: `<svg viewBox="0 0 64 64"><path d="M6 14a4 4 0 0 1 4-4h15l6 7h23a4 4 0 0 1 4 4v29a4 4 0 0 1-4 4H10a4 4 0 0 1-4-4z" fill="#d49f2c"/><path d="M6 24a4 4 0 0 1 4-4h44a4 4 0 0 1 4 4v26a4 4 0 0 1-4 4H10a4 4 0 0 1-4-4z" fill="#f0c24f"/></svg>`,
    text: `<svg viewBox="0 0 64 64"><path d="M14 6h26l12 12v38a2 2 0 0 1-2 2H14a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z" fill="#fff"/><path d="M40 6l12 12H42a2 2 0 0 1-2-2z" fill="#c9c4b4"/><path d="M20 28h24M20 35h24M20 42h16" stroke="#7b8a90" stroke-width="3" stroke-linecap="round"/></svg>`,
    image: `<svg viewBox="0 0 64 64"><rect x="8" y="12" width="48" height="40" rx="4" fill="#fff"/><rect x="12" y="16" width="40" height="32" rx="2" fill="#8fc7d6"/><circle cx="22" cy="26" r="4" fill="#f6e08a"/><path d="M12 48l12-14 8 9 7-6 13 11z" fill="#3b7d6e"/></svg>`,
    video: `<svg viewBox="0 0 64 64"><rect x="8" y="12" width="48" height="40" rx="4" fill="#26363c"/><circle cx="32" cy="32" r="13" fill="#e8b84a"/><path d="M28 25l12 7-12 7z" fill="#26363c"/></svg>`,
    audio: `<svg viewBox="0 0 64 64"><rect x="8" y="8" width="48" height="48" rx="8" fill="#26363c"/><path d="M27 41V20l18-4v21" fill="none" stroke="#e8b84a" stroke-width="4" stroke-linejoin="round"/><circle cx="22" cy="42" r="6" fill="#e8b84a"/><circle cx="40" cy="38" r="6" fill="#e8b84a"/></svg>`,
    lock: `<svg class="badge" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="12" rx="2.5" fill="#e8b84a" stroke="#1b2428" stroke-width="1.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="#1b2428" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="16" r="1.8" fill="#1b2428"/></svg>`,
    check: `<svg class="check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#3fae6a" stroke="#fff" stroke-width="1.5"/><path d="M6.5 12.5l3.8 3.8 7.2-7.6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
    corbeille: `<svg viewBox="0 0 64 64"><path d="M16 20h32l-3 34a4 4 0 0 1-4 4H23a4 4 0 0 1-4-4z" fill="#c9d3d8"/><path d="M16 20h32l-1 12H17z" fill="#dfe7ea"/><rect x="12" y="14" width="40" height="6" rx="3" fill="#9fb0b8"/><rect x="25" y="9" width="14" height="6" rx="2" fill="#9fb0b8"/><path d="M26 28v22M32 28v22M38 28v22" stroke="#8da0a8" stroke-width="3" stroke-linecap="round"/></svg>`,
    succes: `<svg viewBox="0 0 64 64"><path d="M20 10h24v16a12 12 0 0 1-24 0z" fill="#ffd36a"/><path d="M20 14h-8v6a10 10 0 0 0 10 10M44 14h8v6a10 10 0 0 1-10 10" fill="none" stroke="#e0a92f" stroke-width="4"/><rect x="28" y="38" width="8" height="10" fill="#e0a92f"/><rect x="20" y="48" width="24" height="7" rx="2" fill="#c78f1d"/><path d="M26 16v10" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".6"/></svg>`,
    other: `<svg viewBox="0 0 64 64"><path d="M14 6h26l12 12v38a2 2 0 0 1-2 2H14a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z" fill="#e3dfd2"/><path d="M40 6l12 12H42a2 2 0 0 1-2-2z" fill="#b9b3a0"/></svg>`
  };

  /* ---------- Sources de données ---------- */
  // Un « nœud » : { name, dir, type, children(), url(), text(), frame }

  // 1) Avec un serveur (Live Server de VS Code, etc.) : on lit la liste affichée par le serveur
  function serverNode(url, name, dir) {
    return {
      name, dir, type: dir ? 'folder' : typeOf(name),
      async children() {
        const res = await fetch(url);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const doc = new DOMParser().parseFromString(await res.text(), 'text/html');
        const base = new URL(url);
        const basePath = base.pathname.endsWith('/') ? base.pathname : base.pathname + '/';
        const seen = new Set(), out = [];
        doc.querySelectorAll('a[href]').forEach(a => {
          const href = a.getAttribute('href');
          if (!href || href.startsWith('?') || href.startsWith('#')) return;
          let u;
          try { u = new URL(href, base); } catch { return; }
          if (u.origin !== base.origin) return;
          if (!u.pathname.startsWith(basePath) || u.pathname === basePath) return;
          const rest = u.pathname.slice(basePath.length).replace(/\/$/, '');
          if (!rest || rest.includes('/') || seen.has(rest)) return;
          seen.add(rest);
          const isDir = u.pathname.endsWith('/') || a.classList.contains('icon-directory');
          u.search = ''; u.hash = '';
          if (isDir && !u.pathname.endsWith('/')) u.pathname += '/';
          out.push(serverNode(u.href, decodeURIComponent(rest), isDir));
        });
        return out;
      },
      url: async () => url,
      text: async () => (await fetch(url)).text()
    };
  }

  // 2) Sans serveur : liste écrite à la main dans bureau.js
  function manifestNode(entry, path) {
    if (typeof entry === 'string') entry = { name: entry };
    const dir = Array.isArray(entry.children);
    const full = path + entry.name + (dir ? '/' : '');
    return {
      name: entry.name, dir, type: dir ? 'folder' : typeOf(entry.name), frame: true,
      children: async () => (entry.children || []).map(c => manifestNode(c, full)),
      url: async () => encodeURI(full),
      text: async () => {
        const r = await fetch(encodeURI(full));
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      }
    };
  }

  const sortNodes = list => list.sort((a, b) => (b.dir - a.dir) || a.name.localeCompare(b.name, 'fr', { numeric: true }));

  /* ---------- Icônes cliquables ---------- */
  function makeIcon(node, onOpen) {
    const b = document.createElement('button');
    b.className = 'icon';
    const visuel = node.icone ? '<img src="' + node.icone + '" alt="" draggable="false">' : ICONS[node.type];
    b.innerHTML = '<div class="ico">' + visuel + '</div><span></span>';
    $('span', b).textContent = node.name;
    b.title = node.name;
    // les jeux (et tout, sur écran tactile) s'ouvrent en un seul clic ; le reste en double-clic
    const simple = () => !!node.app || !!node.special || matchMedia('(pointer: coarse)').matches;
    b.addEventListener('click', () => {
      b.parentElement.querySelectorAll('.sel').forEach(x => x.classList.remove('sel'));
      b.classList.add('sel');
      if (simple()) onOpen(node);
    });
    b.addEventListener('dblclick', () => { if (!simple()) onOpen(node); });
    b.addEventListener('keydown', e => { if (e.key === 'Enter') onOpen(node); });
    return b;
  }

  /* ---------- Fenêtres ---------- */
  let z = 10, offset = 0;
  const wins = new Set();

  function focusWin(w) {
    wins.forEach(x => {
      x.el.classList.toggle('top', x === w);
      x.task.classList.toggle('on', x === w && !x.el.classList.contains('min'));
    });
    w.el.style.zIndex = ++z;
  }

  function openWindow(title, build, size) {
    const el = document.createElement('div');
    el.className = 'win';
    const W = Math.min((size && size.w) || 560, innerWidth - 24), H = Math.min((size && size.h) || 400, innerHeight - 80);
    el.style.width = W + 'px'; el.style.height = H + 'px';
    el.style.left = Math.min((innerWidth > 900 ? 250 : 140) + offset, Math.max(8, innerWidth - W - 8)) + 'px';   // laisse les icônes visibles
    el.style.top = Math.min(40 + offset, Math.max(8, innerHeight - H - 60)) + 'px';
    offset = (offset + 28) % 140;
    el.innerHTML = `<div class="bar"><b></b><button class="m" aria-label="Réduire">–</button><button class="x" aria-label="Fermer">✕</button></div><div class="content" style="display:contents"></div>`;
    $('b', el).textContent = title;
    const task = document.createElement('button');
    task.className = 'task'; task.textContent = title;
    tasks.appendChild(task);
    const w = { el, task };
    wins.add(w);
    document.body.appendChild(el);

    const close = () => { wins.delete(w); el.remove(); task.remove(); w.cleanup && w.cleanup(); };
    $('.x', el).onclick = close;
    $('.m', el).onclick = () => { el.classList.add('min'); task.classList.remove('on'); };
    task.onclick = () => {
      if (el.classList.contains('min')) { el.classList.remove('min'); focusWin(w); }
      else if (el.classList.contains('top')) { el.classList.add('min'); task.classList.remove('on'); }
      else focusWin(w);
    };
    el.addEventListener('pointerdown', () => focusWin(w));

    // Déplacement par la barre de titre
    const bar = $('.bar', el);
    bar.addEventListener('pointerdown', e => {
      if (e.target.closest('button')) return;
      const dx = e.clientX - el.offsetLeft, dy = e.clientY - el.offsetTop;
      bar.setPointerCapture(e.pointerId);
      const move = ev => {
        el.style.left = Math.max(-el.offsetWidth + 80, Math.min(innerWidth - 80, ev.clientX - dx)) + 'px';
        el.style.top = Math.max(0, Math.min(innerHeight - 90, ev.clientY - dy)) + 'px';
      };
      const up = () => { bar.removeEventListener('pointermove', move); bar.removeEventListener('pointerup', up); };
      bar.addEventListener('pointermove', move);
      bar.addEventListener('pointerup', up);
    });

    build(el, w);
    focusWin(w);
    if (!(size && size.silencieux)) son('ding');
    return w;
  }

  /* ---------- Ouverture d'un élément ---------- */
  function openNode(node) {
    if (node.dir) return openFolder(node);
    if (node.type === 'image') return openMedia(node, 'img');
    if (node.type === 'video') return openMedia(node, 'video');
    if (node.type === 'audio') return openAudio(node);
    openText(node); // textes, et tentative en texte pour les autres fichiers
  }

  function suivi(pile) {
    const racine = pile[0].name.toLowerCase();
    if (racine.includes('corbeille')) succes('corbeille');
    if (racine.includes('ouvre quand') && pile.length > 1) succes('ouvre');
    if (lockNode && pile[0] === lockNode) { succes('nico'); const b = boutons.get(lockNode); if (b) b.classList.remove('pulse'); }
  }

  function openFolder(root) {
    openWindow(root.name, (el, w) => {
      const stack = [root];
      const content = $('.content', el);
      content.innerHTML = `<div class="path"><button class="up" aria-label="Dossier parent">↑</button><span class="where"></span></div><div class="body"></div>`;
      const up = $('.up', content), where = $('.where', content), body = $('.body', content);

      async function show() {
        const cur = stack[stack.length - 1];
        where.textContent = stack.map(n => n.name).join(' / ');
        up.disabled = stack.length < 2;
        w.task.textContent = cur.name; $('b', el).textContent = cur.name;
        suivi(stack);
        body.innerHTML = '<div class="note">Chargement…</div>';
        try {
          const list = sortNodes(await cur.children());
          if (!list.length) { body.innerHTML = '<div class="note">Ce dossier est vide.</div>'; return; }
          const grid = document.createElement('div'); grid.className = 'grid';
          list.forEach(n => grid.appendChild(makeIcon(n, x => {
            if (x.dir) { stack.push(x); show(); } else openNode(x);
          })));
          body.replaceChildren(grid);
        } catch {
          body.innerHTML = '<div class="note">Impossible de lire ce dossier.</div>';
        }
      }
      up.onclick = () => { if (stack.length > 1) { stack.pop(); show(); } };
      show();
    });
  }

  function openText(node) {
    openWindow(node.name, async el => {
      const content = $('.content', el);
      content.innerHTML = '<div class="body"><div class="note">Chargement…</div></div>';
      const body = $('.body', content);
      try {
        const t = await node.text();
        const pre = document.createElement('pre'); pre.className = 'txt';
        pre.textContent = t || '(fichier vide)';
        body.replaceChildren(pre);
        return;
      } catch {}
      if (node.frame) {   // ouvert en double-clic : le navigateur affiche le fichier lui-même
        const f = document.createElement('iframe');
        f.src = await node.url();
        f.style.cssText = 'width:100%;height:100%;border:0;background:#fff';
        body.replaceChildren(f);
      } else body.innerHTML = '<div class="note">Impossible de lire ce fichier.</div>';
    });
  }

  function openAudio(node) {
    openWindow(node.name, async (el, w) => {
      const content = $('.content', el);
      content.innerHTML = '<div class="body"><div class="player">' + ICONS.audio + '<div class="t"></div></div></div>';
      $('.t', content).textContent = node.name.replace(/\.[^.]+$/, '');
      succes('vocal');
      const a = document.createElement('audio');
      a.controls = true; a.autoplay = true;
      a.src = await node.url();
      a.addEventListener('error', () => { $('.t', content).textContent = 'Impossible de lire ce fichier audio.'; });
      $('.player', content).appendChild(a);
      w.cleanup = () => { a.pause(); a.removeAttribute('src'); a.load(); };
    }, { w: 400, h: 260 });
  }

  function openMedia(node, tag) {
    openWindow(node.name, async (el, w) => {
      const content = $('.content', el);
      content.innerHTML = '<div class="body"><div class="media"></div></div>';
      const m = document.createElement(tag);
      m.src = await node.url();
      if (tag === 'video') { m.controls = true; m.autoplay = true; }
      else m.alt = node.name;
      $('.media', content).appendChild(m);
      w.cleanup = () => { if (tag === 'video') m.pause(); };
    });
  }

  /* ---------- Démarrage du bureau ---------- */
  function showHelp(html, title) {
    $('#empty h1').textContent = title || 'Je cherche le dossier « bureau »';
    $('#emptyMsg').innerHTML = html;
    $('#empty').hidden = false;
  }

  /* ---------- Jeux et dossier verrouillé ---------- */
  const DOSSIER_VERROUILLE = 'nico';   // se débloque quand les trois jeux sont terminés
  const Jeux = window.Jeux || { apps: [], estTermine: () => false, tousTermines: () => false,
    reinitialiser() {}, toutTerminer() {}, ouvrir() {} };
  if (location.search.includes('reset')) {                            // ex. bureau.html?reset
    Jeux.reinitialiser();
    try { window.Succes && window.Succes.reinitialiser(); } catch {}
    ['bureau-fete', 'bureau-fond', 'bureau-fond-perso'].forEach(lsDel);
  }
  if (location.search.includes('debloquer')) Jeux.toutTerminer();     // ex. bureau.html?debloquer (pour tester)

  let lockNode = null;
  const boutons = new Map();
  const estVerrouille = n => n === lockNode && !Jeux.tousTermines();

  function majVerrous() {
    boutons.forEach((btn, n) => {
      if (n.app) btn.classList.toggle('done', Jeux.estTermine(n.app));
      const l = estVerrouille(n);
      btn.classList.toggle('locked', l);
      if (n === lockNode) {
        btn.title = l ? n.name + ' (verrouillé)' : n.name;
        btn.classList.toggle('pulse', !l && !(window.Succes && window.Succes.estDebloque('nico')));
      }
    });
  }
  Jeux.onChange = id => {
    majVerrous();
    const app = Jeux.apps.find(a => a.id === id);
    if (lockNode && Jeux.tousTermines()) {
      toast('Les trois jeux sont terminés : le dossier « ' + lockNode.name + ' » est déverrouillé !');
      setTimeout(() => lancerFete(), 2600);       // le temps de voir le résultat du dernier jeu
    } else toast('Jeu terminé : ' + (app ? app.nom : id) + ' ✓');
  };

  let toastTimer;
  function toast(txt) {
    const t = $('#toast'); t.textContent = txt; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 4500);
  }

  function messageBox(titre, texte) {
    openWindow(titre, (el, w) => {
      const c = $('.content', el);
      c.innerHTML = '<div class="msg"><p></p><button>OK</button></div>';
      $('p', c).textContent = texte;
      const ok = $('button', c); ok.onclick = () => $('.x', el).click(); ok.focus();
    }, { w: 360, h: 190, silencieux: true });
  }

  function ouvrirDepuisBureau(node) {
    if (node.special === 'succes') { window.Succes && window.Succes.ouvrir({ openWindow }); return; }
    if (node.app) { Jeux.ouvrir(node.app, { openWindow }); return; }
    if (estVerrouille(node)) {
      son('erreur');
      messageBox('Accès refusé', 'Ce dossier est verrouillé. Termine d’abord les trois jeux du bureau.');
      return;
    }
    openNode(node);
  }

  function showDesktop(list, url) {
    sortNodes(list);
    lockNode = list.find(n => n.dir && n.name.toLowerCase() === DOSSIER_VERROUILLE) || null;
    const corbeille = list.find(n => n.dir && n.name.toLowerCase() === 'corbeille') || null;
    if (corbeille) corbeille.type = 'corbeille';
    const apps = Jeux.apps.map(a => ({
      name: a.nom, dir: false, type: 'app', icone: a.icone, app: a.id, children: async () => []
    }));
    const noeudSucces = { name: 'Succès', dir: false, type: 'succes', special: 'succes', children: async () => [] };
    const tout = [...list.filter(n => n !== corbeille), ...apps, noeudSucces, ...(corbeille ? [corbeille] : [])];
    boutons.clear();
    desktop.replaceChildren(...tout.map(n => {
      const b = makeIcon(n, ouvrirDepuisBureau);
      boutons.set(n, b);
      if (n === lockNode) $('.ico', b).insertAdjacentHTML('beforeend', ICONS.lock);
      if (n.app) $('.ico', b).insertAdjacentHTML('beforeend', ICONS.check);
      return b;
    }));
    majVerrous();
    $('#empty').hidden = true;
    if (!list.length) showHelp(
      'Le navigateur a bien trouvé le serveur, mais aucun élément dans le dossier <code>bureau</code>.' +
      (url ? '<br><br>Adresse lue : <a href="' + url + '" target="_blank" rel="noopener">' + url + '</a>' : '') +
      '<br><br>Vérifie que le dossier <code>bureau</code> contient au moins un élément et qu’il est à côté de <code>bureau.html</code>.',
      'Le dossier « bureau » semble vide');
  }

  desktop.addEventListener('click', e => {
    if (e.target === desktop) desktop.querySelectorAll('.sel').forEach(x => x.classList.remove('sel'));
  });

  async function start() {
    const rootUrl = new URL('bureau/', location.href).href;
    let list = [];
    // 1) Serveur qui affiche la liste des fichiers (Live Server) : lecture automatique
    try { list = await serverNode(rootUrl, 'bureau', true).children(); } catch {}
    // 2) Sinon (Netlify, double-clic…) : liste écrite dans bureau.js
    if (!list.length && Array.isArray(window.BUREAU)) {
      list = window.BUREAU.map(e => manifestNode(e, 'bureau/'));
    }
    if (list.length) return showDesktop(list);
    showHelp(
      'Je n’ai trouvé ni liste de fichiers, ni <code>bureau.js</code>.<br><br>' +
      'Lance <code>node generer.js</code> pour créer <code>bureau.js</code> à partir de ton dossier <code>bureau</code>, ou ouvre la page avec Live Server.',
      'Dossier « bureau » introuvable');
  }

  /* ---------- Fond d'écran (clic droit sur le bureau) ---------- */
  const CLE_FOND = 'bureau-fond';
  const DEGRADES = {
    turquoise: ['Dégradé turquoise', ''],
    nuit: ['Dégradé nuit', 'radial-gradient(ellipse at 20% 15%, #5b57b8 0%, transparent 55%), radial-gradient(ellipse at 85% 90%, #090a1d 0%, transparent 60%), linear-gradient(135deg, #15132f, #2d2b6e)'],
    rose: ['Dégradé rose', 'radial-gradient(ellipse at 20% 15%, #ffc2d9 0%, transparent 55%), radial-gradient(ellipse at 85% 90%, #7a2a55 0%, transparent 60%), linear-gradient(135deg, #b34b7d, #e48bb0)']
  };
  let modeFond = lsGet(CLE_FOND) || 'auto';
  let photoNous = null, imagePerso = lsGet(CLE_FOND + '-perso');

  function trouverPhoto() {                 // cherche fonds/nous.jpg (ou .png, .webp)
    return new Promise(resolve => {
      const exts = ['jpg', 'jpeg', 'png', 'webp']; let i = 0;
      const essai = () => {
        if (i >= exts.length) return resolve(null);
        const img = new Image(), u = 'fonds/nous.' + exts[i++];
        img.onload = () => resolve(u); img.onerror = essai; img.src = u;
      };
      essai();
    });
  }
  const calqueImage = u => 'linear-gradient(rgba(0,0,0,.2), rgba(0,0,0,.2)), url("' + u + '") center / cover no-repeat';
  function appliquerFond() {
    let css = '';
    if (modeFond === 'perso' && imagePerso) css = calqueImage(imagePerso);
    else if ((modeFond === 'photo' || modeFond === 'auto') && photoNous) css = calqueImage(photoNous);
    else if (modeFond.startsWith('degrade:') && DEGRADES[modeFond.slice(8)]) css = DEGRADES[modeFond.slice(8)][1];
    document.body.style.background = css;
  }

  const menuFond = $('#menu-fond');
  function fermerMenu() { menuFond.hidden = true; }
  function ouvrirMenuFond(x, y, ancre) {
    const choix = [];
    if (photoNous) choix.push(['photo', 'Notre photo']);
    Object.entries(DEGRADES).forEach(([k, v]) => choix.push(['degrade:' + k, v[0]]));
    choix.push(['perso', 'Choisir une image…']);
    const actuel = modeFond === 'auto' ? (photoNous ? 'photo' : 'degrade:turquoise') : modeFond;
    menuFond.innerHTML = '<div class="menu-titre">Fond d’écran</div>' + choix.map(([m, t]) =>
      '<button type="button" role="menuitem" data-m="' + m + '"' + (m === actuel ? ' class="actif"' : '') + '>' + t + '</button>').join('');
    menuFond.hidden = false;
    const r = menuFond.getBoundingClientRect();
    menuFond.style.left = Math.max(8, Math.min(x, innerWidth - r.width - 8)) + 'px';
    menuFond.style.top = Math.max(8, ancre ? y - r.height - 8 : Math.min(y, innerHeight - r.height - 8)) + 'px';
    menuFond.querySelector('button').focus();
  }
  menuFond.addEventListener('click', e => {
    const b = e.target.closest('button[data-m]'); if (!b) return;
    const m = b.dataset.m;
    fermerMenu();
    if (m === 'perso') { $('#fond-fichier').click(); return; }
    modeFond = m; lsSet(CLE_FOND, m); appliquerFond(); succes('fond'); son('ding');
  });
  document.addEventListener('pointerdown', e => { if (!menuFond.hidden && !e.target.closest('#menu-fond')) fermerMenu(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') fermerMenu(); });
  desktop.addEventListener('contextmenu', e => {
    if (e.target !== desktop) return;
    e.preventDefault(); ouvrirMenuFond(e.clientX, e.clientY);
  });
  $('#btn-fond').addEventListener('click', e => {
    if (!menuFond.hidden) { fermerMenu(); return; }
    const r = e.currentTarget.getBoundingClientRect();
    ouvrirMenuFond(r.left - 160, r.top, true);
  });
  $('#fond-fichier').addEventListener('change', e => {      // image choisie sur l'appareil
    const f = e.target.files[0]; e.target.value = '';
    if (!f) return;
    const url = URL.createObjectURL(f), img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1920 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      imagePerso = c.toDataURL('image/jpeg', 0.82);
      URL.revokeObjectURL(url);
      try { localStorage.setItem(CLE_FOND + '-perso', imagePerso); } catch { toast('Image gardée seulement jusqu’à la fermeture de la page (trop lourde pour être mémorisée).'); }
      modeFond = 'perso'; lsSet(CLE_FOND, modeFond); appliquerFond(); succes('fond'); son('ding');
    };
    img.onerror = () => { URL.revokeObjectURL(url); toast('Impossible de lire cette image.'); };
    img.src = url;
  });

  /* ---------- Son ---------- */
  const btnSon = $('#btn-son');
  const majBtnSon = () => { const on = !window.Sons || window.Sons.actif; btnSon.textContent = on ? '🔊' : '🔇'; btnSon.setAttribute('aria-pressed', String(!on)); };
  btnSon.addEventListener('click', () => { if (window.Sons) window.Sons.basculer(); majBtnSon(); });
  majBtnSon();

  /* ---------- Écran de fête (les trois jeux sont terminés) ---------- */
  let rafConfettis = 0;
  function confettis() {
    cancelAnimationFrame(rafConfettis);
    const c = $('#confetti'), g = c.getContext('2d');
    c.width = innerWidth; c.height = innerHeight;
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const couleurs = ['#ffd36a', '#ff9fc4', '#7fe3ff', '#c9a7ff', '#ffffff', '#6fd68f'];
    const nv = p => { p.x = Math.random() * c.width; p.y = -10 - Math.random() * 60; p.vy = 2 + Math.random() * 3.5; };
    const ps = Array.from({ length: 150 }, () => {
      const p = { vx: (Math.random() - .5) * 2.4, r: 5 + Math.random() * 7, a: Math.random() * 6.28, va: (Math.random() - .5) * .3, col: couleurs[(Math.random() * couleurs.length) | 0] };
      nv(p); p.y = Math.random() * -c.height * .8; return p;
    });
    const debut = performance.now();
    (function boucle(t) {
      g.clearRect(0, 0, c.width, c.height);
      const encore = t - debut < 4500;
      ps.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.a += p.va;
        if (p.y > c.height + 20 && encore) nv(p);
        g.save(); g.translate(p.x, p.y); g.rotate(p.a); g.fillStyle = p.col; g.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); g.restore();
      });
      if (t - debut < 7500 && !$('#fete').hidden) rafConfettis = requestAnimationFrame(boucle);
      else g.clearRect(0, 0, c.width, c.height);
    })(debut);
  }
  function fermerFete() { $('#fete').hidden = true; cancelAnimationFrame(rafConfettis); }
  function lancerFete(force) {
    if (!force && lsGet('bureau-fete')) return;
    lsSet('bureau-fete', '1');
    const P = (window.PERSO && window.PERSO.fete) || {};
    $('#fete-titre').textContent = P.titre || 'Tu as tout terminé !';
    $('#fete-texte').textContent = P.texte || 'Un dossier vient de se déverrouiller.';
    $('#fete-btn').textContent = P.bouton || 'Ouvrir le dossier';
    $('#fete').hidden = false;
    son('fanfare'); confettis();
    $('#fete-btn').focus();
  }
  $('#fete-btn').addEventListener('click', () => { fermerFete(); if (lockNode && !estVerrouille(lockNode)) ouvrirDepuisBureau(lockNode); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#fete').hidden) fermerFete(); });

  /* ---------- Bloc-notes caché (clic sur l'horloge) ---------- */
  function ouvrirBlocNotes() {
    const P = (window.PERSO && window.PERSO.secret) || { titre: 'secret.txt', texte: '…' };
    succes('secret'); son('notif');
    openWindow(P.titre + ' – Bloc-notes', el => {
      $('.content', el).innerHTML = '<div class="bn"><div class="bn-menu"><span>Fichier</span><span>Édition</span><span>Format</span><span>Affichage</span></div><textarea class="bn-zone" readonly aria-label="Contenu du bloc-notes"></textarea></div>';
      $('.bn-zone', el).value = P.texte;
    }, { w: 440, h: 360, silencieux: true });
  }
  $('#clock').addEventListener('click', ouvrirBlocNotes);
  $('#clock').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); ouvrirBlocNotes(); } });

  /* ---------- Horloge ---------- */
  const tick = () => {
    const d = new Date();
    $('#clock').innerHTML = d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) +
      '<br>' + d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
  };
  tick(); setInterval(tick, 15000);

  trouverPhoto().then(u => { photoNous = u; appliquerFond(); });
  appliquerFond();

  // jingle de démarrage (si le navigateur l'autorise, sinon au premier clic)
  (async () => {
    const joue = window.Sons ? await window.Sons.demarrage() : true;
    if (!joue && window.Sons && window.Sons.actif) {
      addEventListener('pointerdown', () => { if (performance.now() < 15000) window.Sons.demarrage(); }, { once: true });
    }
  })();

  if (location.search.includes('fete')) setTimeout(() => lancerFete(true), 900);   // aperçu : bureau.html?fete
  start();
})();
</script>
</body>
</html>
