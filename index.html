<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Démarrage</title>
<style>
  :root {
    --grey: #c0c0c0;
    --light: #ffffff;
    --shadow: #808080;
    --dark: #000000;
    --navy: #000080;
    --teal: #008080;
    font-family: "Lucida Console", "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { background: #000; color: #c8c8c8; font-size: 15px; }

  /* ---------- Écran noir (BIOS) ---------- */
  #bios {
    position: absolute; inset: 0; padding: 24px 28px; line-height: 1.5;
    white-space: pre-wrap; overflow: hidden;
  }
  #bios .bright { color: #fff; }
  #bios .cursor { display: inline-block; width: 9px; height: 16px; background: #c8c8c8; vertical-align: -2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ---------- Écran bureau bleu-vert ---------- */
  #stage {
    position: absolute; inset: 0; display: none; place-items: center;
    background: var(--teal); padding: 16px;
  }
  .win {
    width: min(440px, 100%); background: var(--grey); padding: 3px;
    border: 2px solid; border-color: var(--light) var(--dark) var(--dark) var(--light);
    box-shadow: 1px 1px 0 var(--dark), 6px 6px 0 rgba(0,0,0,.35);
    color: #000; font-size: 13px;
  }
  .title {
    background: linear-gradient(90deg, var(--navy), #1084d0);
    color: #fff; font-weight: bold; padding: 3px 6px; display: flex; align-items: center; gap: 6px;
  }
  .inner { padding: 18px 16px 16px; }
  .inner p { margin: 0 0 12px; line-height: 1.45; }

  /* Barre de chargement à blocs */
  .track {
    height: 26px; padding: 3px; display: flex; gap: 2px; background: #fff;
    border: 2px solid; border-color: var(--shadow) var(--light) var(--light) var(--shadow);
  }
  .track i { flex: 1; background: transparent; }
  .track i.on { background: var(--navy); }
  #pct { margin-top: 8px; text-align: right; }

  /* Connexion */
  #login { display: none; }
  label { display: block; margin-bottom: 6px; }
  input {
    width: 100%; font: inherit; font-size: 14px; padding: 5px 6px; letter-spacing: 2px; background: #fff; color: #000;
    border: 2px solid; border-color: var(--shadow) var(--light) var(--light) var(--shadow); outline: none;
  }
  input:focus-visible { outline: 1px dotted #000; outline-offset: -5px; }
  .hint {
    margin: 14px 0 0; padding: 8px 10px; background: #ffffe1; border: 1px solid #000; line-height: 1.45;
  }
  #msg { min-height: 18px; margin: 10px 0 0; color: #a00000; font-weight: bold; }
  .row { display: flex; justify-content: flex-end; margin-top: 6px; }
  button {
    font: inherit; font-size: 13px; min-width: 84px; padding: 6px 14px; background: var(--grey); color: #000; cursor: pointer;
    border: 2px solid; border-color: var(--light) var(--dark) var(--dark) var(--light);
    box-shadow: inset -1px -1px 0 var(--shadow);
  }
  button:active { border-color: var(--dark) var(--light) var(--light) var(--dark); box-shadow: inset 1px 1px 0 var(--shadow); }
  button:focus-visible { outline: 1px dotted #000; outline-offset: -5px; }
  .shake { animation: shake .35s; }
  @keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }
  /* ---------- Vidéo d'intro ---------- */
  #intro {
    position: fixed; inset: 0; z-index: 1000; background: #000; display: none;
    align-items: center; justify-content: center; opacity: 0; transition: opacity .6s;
  }
  #intro.show { opacity: 1; }
  #intro video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  #skip, #playbtn {
    position: absolute; font: inherit; font-size: 13px; color: #fff; cursor: pointer;
    background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.4); border-radius: 4px; padding: 7px 14px;
  }
  #skip { right: 16px; bottom: 16px; opacity: .75; min-width: 0; }
  #skip:hover { opacity: 1; background: rgba(0,0,0,.8); }
  #playbtn { display: none; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 16px; padding: 12px 24px; }
  #skip:focus-visible, #playbtn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .shake, #bios .cursor { animation: none; } #intro { transition: none; } }
</style>
</head>
<body>

<div id="bios" aria-live="polite"></div>

<main id="stage">
  <section class="win" id="loading" aria-label="Chargement">
    <div class="title">Démarrage de l’ordinateur</div>
    <div class="inner">
      <p id="status">Vérification de la mémoire…</p>
      <div class="track" id="track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
      <div id="pct">0 %</div>
    </div>
  </section>

  <section class="win" id="login" aria-label="Connexion">
    <div class="title">Ouvrir une session</div>
    <div class="inner">
      <form id="form" autocomplete="off">
        <p>Entre ton mot de passe pour accéder au bureau.</p>
        <label for="pw">Mot de passe :</label>
        <input id="pw" type="password" spellcheck="false" autocapitalize="characters" autocomplete="off">
        <p class="hint"><b>Indice :</b> tape la date de naissance, puis la première lettre du prénom et du nom à la fin.</p>
        <p id="msg" role="alert"></p>
        <div class="row"><button type="submit">OK</button></div>
      </form>
    </div>
  </section>
</main>

<div id="intro" aria-label="Vidéo d'introduction">
  <video id="introVideo" playsinline preload="auto">
    <source src="video/intro.mp4" type="video/mp4">
    <source src="video/intro.webm" type="video/webm">
  </video>
  <button id="playbtn" type="button">▶ Lancer la vidéo</button>
  <button id="skip" type="button">Passer ›</button>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const PASSWORD = '16012005ND';
  const wait = ms => new Promise(r => setTimeout(r, ms));

  /* ---------- 1. Écran noir façon BIOS ---------- */
  const lines = [
    ['<span class="bright">BIOS Version 4.51 PG</span>', 250],
    ['Copyright (C) 1994-1998, Phoenix Technologies', 150],
    ['', 120],
    ['Processeur : Pentium 166 MHz', 300],
    ['Test de la mémoire : ', 0],
  ];
  async function bios() {
    const out = $('#bios');
    const add = html => { out.insertAdjacentHTML('beforeend', html); };
    for (const [html, d] of lines) { add(html + (html.endsWith(': ') ? '' : '\n')); await wait(d); }
    for (let k = 0; k <= 32768; k += 2048 + Math.random() * 2000) {   // compteur de mémoire
      const v = Math.min(32768, Math.round(k));
      out.innerHTML = out.innerHTML.replace(/Test de la mémoire : [^\n<]*/, 'Test de la mémoire : ' + v + ' Ko');
      await wait(70);
    }
    out.innerHTML = out.innerHTML.replace(/Test de la mémoire : [^\n<]*/, 'Test de la mémoire : 32768 Ko OK');
    add('\n\nDétection du disque dur… ');
    await wait(500); add('OK\n');
    add('Recherche du système… ');
    await wait(600); add('trouvé\n\n<span class="cursor"></span>');
    await wait(700);
  }

  /* ---------- 2. Barre de chargement à blocs ---------- */
  const BLOCKS = 22;
  const track = $('#track');
  for (let i = 0; i < BLOCKS; i++) track.appendChild(document.createElement('i'));
  const msgs = [
    [0, 'Vérification de la mémoire…'],
    [20, 'Chargement des pilotes…'],
    [45, 'Lecture du disque dur…'],
    [70, 'Préparation du bureau…'],
    [92, 'Presque prêt…']
  ];
  async function load() {
    let p = 0;
    while (p < 100) {
      p = Math.min(100, p + 2 + Math.random() * 5);
      if (Math.random() < .12) await wait(450);          // petit temps d'arrêt, comme un vieux disque
      const shown = Math.floor(p);
      const on = Math.floor(p / 100 * BLOCKS);
      [...track.children].forEach((b, i) => b.classList.toggle('on', i < on));
      $('#pct').textContent = shown + ' %';
      track.setAttribute('aria-valuenow', shown);
      $('#status').textContent = msgs.filter(m => shown >= m[0]).pop()[1];
      await wait(90 + Math.random() * 110);
    }
    [...track.children].forEach(b => b.classList.add('on'));
    $('#pct').textContent = '100 %';
    $('#status').textContent = 'Démarrage terminé.';
    await wait(600);
  }

  /* ---------- 4. Vidéo d'intro puis bureau ---------- */
  let termine = false;
  function versBureau() {
    if (termine) return; termine = true;
    $('#intro').classList.remove('show');
    setTimeout(() => { location.href = 'bureau.html'; }, 600);
  }
  function lancerIntro() {
    const box = $('#intro'), vid = $('#introVideo');
    box.style.display = 'flex';
    requestAnimationFrame(() => box.classList.add('show'));
    vid.addEventListener('ended', versBureau);
    $('#skip').onclick = versBureau;
    // si la vidéo est introuvable, on passe directement au bureau
    const sources = [...vid.querySelectorAll('source')];
    sources.forEach(src => src.addEventListener('error', () => {
      src.dataset.ko = '1';
      if (sources.every(x => x.dataset.ko)) versBureau();
    }));
    vid.addEventListener('error', versBureau);
    const lire = vid.play();
    if (lire && lire.catch) lire.catch(() => {            // lecture auto bloquée : bouton manuel
      const b = $('#playbtn'); b.style.display = 'block'; b.focus();
      b.onclick = () => { b.style.display = 'none'; vid.play().catch(versBureau); };
    });
  }

  /* ---------- 3. Mot de passe ---------- */
  function askPassword() {
    $('#loading').style.display = 'none';
    $('#login').style.display = 'block';
    $('#pw').focus();
    $('#form').addEventListener('submit', e => {
      e.preventDefault();
      const v = $('#pw').value.trim().toUpperCase();
      if (v === PASSWORD) {
        $('#msg').style.color = '#006000';
        $('#msg').textContent = 'Connexion en cours…';
        $('#pw').disabled = true; $('#form button').disabled = true;
        setTimeout(lancerIntro, 500);
      } else {
        $('#msg').style.color = '#a00000';
        $('#msg').textContent = 'Mot de passe incorrect. Réessaie.';
        const w = $('#login');
        w.classList.remove('shake'); void w.offsetWidth; w.classList.add('shake');
        $('#pw').select();
      }
    });
  }

  (async () => {
    await bios();
    $('#bios').style.display = 'none';
    $('#stage').style.display = 'grid';
    await load();
    askPassword();
  })();
})();
</script>
</body>
</html>
